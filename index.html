<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortnite Crosshair Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#08090d;color:#f4f4f5;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:40px 22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{color:#8b5cf6;font-weight:800;letter-spacing:.12em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}.card{background:#11131a;border:1px solid #252936;border-radius:20px;padding:22px}.preview{height:420px;display:grid;place-items:center;background:radial-gradient(circle,#202431 1px,transparent 1px);background-size:18px 18px;border-radius:16px}.cross{position:relative;width:140px;height:140px}.cross i{position:absolute;background:#fff;border-radius:3px;box-shadow:0 0 12px #fff}.cross .h{width:100%;height:7px;top:67px}.cross .v{width:7px;height:100%;left:67px}.cross .dot{width:13px;height:13px;left:63px;top:63px;border-radius:50%}.controls{display:grid;gap:14px}label{display:flex;justify-content:space-between;gap:14px}input[type=color]{width:52px;height:32px;border:0;background:none}input[type=range]{width:180px}button{border:0;border-radius:12px;padding:12px 16px;background:#7c3aed;color:white;font-weight:800;cursor:pointer}select{background:#191c25;color:white;border:1px solid #303442;border-radius:10px;padding:10px}code{background:#191c25;padding:3px 7px;border-radius:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{height:320px}}</style></head><body><main class="wrap"><div class="hero"><div><div class="badge">FORTNITE / CROSSHAIR LAB</div><h1>Custom Crosshair</h1><p>Vytvoř si vlastní crosshair a hned ho otestuj v preview.</p></div><button onclick="reset()">Reset</button></div><div class="grid"><section class="card"><div class="preview"><div class="cross" id="cross"><i class="h"></i><i class="v"></i><i class="dot"></i></div></div></section><section class="card controls"><label>Barva <input id="color" type="color" value="#ffffff"></label><label>Velikost <input id="size" type="range" min="40" max="180" value="140"></label><label>Tloušťka <input id="thick" type="range" min="2" max="16" value="7"></label><label>Dot <input id="dot" type="range" min="0" max="24" value="13"></label><label>Preset <select id="preset"><option value="classic">Classic</option><option value="dot">Dot</option><option value="plus">Plus</option></select></label><button onclick="copyConfig()">Copy config</button><p id="status"></p></section></div></main><script>const $=id=>document.getElementById(id);function render(){let s=+$('size').value,t=+$('thick').value,d=+$('dot').value,c=$('color').value;x=$('cross');x.style.width=s+'px';x.style.height=s+'px';document.querySelector('.h').style.cssText='width:100%;height:'+t+'px;top:calc(50% - '+t/2+'px);background:'+c;document.querySelector('.v').style.cssText='height:100%;width:'+t+'px;left:calc(50% - '+t/2+'px);background:'+c;document.querySelector('.dot').style.cssText='width:'+d+'px;height:'+d+'px;left:calc(50% - '+d/2+'px);top:calc(50% - '+d/2+'px);background:'+c;document.querySelector('.dot').style.display=$('preset').value==='plus'?'none':d?'block':'none';if($('preset').value==='dot'){document.querySelector('.h').style.display='none';document.querySelector('.v').style.display='none'}else{document.querySelector('.h').style.display='block';document.querySelector('.v').style.display='block'}}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));$('preset').addEventListener('change',render);function reset(){location.reload()}function copyConfig(){navigator.clipboard?.writeText(JSON.stringify({color:$('color').value,size:$('size').value,thickness:$('thick').value,dot:$('dot').value,preset:$('preset').value}));$('status').textContent='Config copied!'}render();</script></body></html>
