<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortnite Crosshair Presets</title><style>body{font-family:system-ui;background:#090a0f;color:#eee;max-width:900px;margin:auto;padding:32px}h1{margin-bottom:4px}.sub{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:24px}.p{padding:18px;background:#151821;border:1px solid #272b36;border-radius:14px;cursor:pointer}.p:hover{border-color:#8b5cf6}.mini{height:70px;display:grid;place-items:center}.x{width:40px;height:40px;position:relative}.x:before,.x:after{content:'';position:absolute;background:#fff}.x:before{width:40px;height:3px;top:18px}.x:after{height:40px;width:3px;left:18px}.dot{width:7px;height:7px;border-radius:50%;background:#fff;position:absolute;left:17px;top:17px}.note{margin-top:25px;color:#9ca3af}</style></head><body><h1>Fortnite Crosshair Lab</h1><div class="sub">Preset galerie pro Fortnite. Overlay se zobrazí jen při spuštěném Fortnite.</div><div class="grid" id="grid"></div><div class="note">Overlay je čistě vizuální a nic neinjektuje do hry.</div><script>const names=['Classic Plus','Small Dot','Tiny Cross','Center Dot','Thin Cross','Thick Cross','Open Cross','Gap Cross','Minimal','Precision','Long Lines','Short Lines','Dot + Cross','Four Point','Tactical','Clean','Compact','Wide','Micro','Streamer'];document.getElementById('grid').innerHTML=names.map(n=>'<div class="p"><div class="mini"><div class="x"><span class="dot"></span></div></div><b>'+n+'</b></div>').join('');</script></body></html>
